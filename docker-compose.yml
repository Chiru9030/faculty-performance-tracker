version: '3.8'

services:
  mongodb:
    image: mongo:6-jammy
    container_name: faculty_finder_db
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: faculty_finder
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: faculty_finder_backend
    restart: always
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - MONGO_URI=mongodb://mongodb:27017/faculty_finder
      - JWT_SECRET=production_faculty_finder_secret_2026
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    container_name: faculty_finder_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data:
